><text x="138" y="79.4" text-anchor="middle" class="bub" font-size="18">Keep going, my guy. Build</text><text x="138" y="99.5" text-anchor="middle" class="bub" font-size="18">build build until you can build</text><text x="138" y="119.7" text-anchor="middle" class="bub" font-size="18">no more.</text><path d="M272,198.6 L282.2,199 L298,198.6" fill="#ffffff" stroke="#1b1a22" stroke-width="3" stroke-linejoin="round"/><rect x="138.5" y="145.3" width="233.5" height="56.3" rx="22" fill="#ffffff" stroke="#1b1a22" stroke-width="3"/><path d="M274,199.6 H296" stroke="#ffffff" stroke-width="4"/><text x="255.3" y="171.8" text-anchor="middle" class="bub" font-size="18">Say no more. Literally. I&#x27;m</text><text x="255.3" y="192" text-anchor="middle" class="bub" font-size="18">busy.</text></g><rect x="1.5" y="1.5" width="377" height="377" fill="none" stroke="#1b1a22" stroke-width="5"/><text x="2" y="400" class="src">Source: Boyd&#x27;s standing instruction to TokenMax tonight, quoted as</text><text x="2" y="415" class="src">written. No other messages are quoted.</text></svg>